<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Button Styling — Jared Dawkins</title>
        <link href="css/styles.css" rel="stylesheet">
    </head>
    <body>
        <main>
            <h1>Button Styling — Jared Dawkins</h1>
            <div class="buttons">
                <div class="button-container">
                    <a href="http://www.nike.com/us/en_us/" target="_blank" rel="noopener noreferrer" class="nike-button">
                        <span>NIKE</span>
                    </a>
                </div>
                <div class="button-container">
                    <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" class="instagram-button">
                        <span class="camera" aria-hidden="true"></span>
                        <span>Instagram</span>
                    </a>
                </div>
                <div class="button-container">
                    <a href="http://www.cartoonnetwork.com/" target="_blank" rel="noopener noreferrer" class="cartoon-button" aria-label="Cartoon Network">
                        <span class="cartoon-tiles" aria-hidden="true">
                            <span class="cartoon-c">C</span>
                            <span class="cartoon-n">N</span>
                        </span>
                        <span class="cartoon-name">CARTOON NETWORK</span>
                    </a>
                </div>
                <div class="button-container">
                    <a href="http://www.missouribotanicalgarden.org/" target="_blank" rel="noopener noreferrer" class="garden-button">
                        <span class="garden-top">Missouri</span>
                        <span class="garden-bottom">Botanical Garden</span>
                    </a>
                </div>
                <div class="button-container">
                    <a href="http://www.coca-cola.com/" target="_blank" rel="noopener noreferrer" class="coke-button">
                        <span class="coke-name">Coca-Cola</span>
                        <span class="bubble bubble-one" aria-hidden="true"></span>
                        <span class="bubble bubble-two" aria-hidden="true"></span>
                        <span class="bubble bubble-three" aria-hidden="true"></span>
                    </a>
                </div>
            </div>
        </main>
    </body>
</html>
